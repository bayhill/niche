<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusDot — preview</title>
</head>
<body>
<div class="nx-stage nx-stage--center" style="height:104px">
<div class="nx-glass nx-glass--row" style="gap:18px"><span style="display:flex;align-items:center;gap:6px"><span class="nx-dot nx-tint-secondary"></span><span class="caption nx-caption">Idle</span></span><span style="display:flex;align-items:center;gap:6px"><span class="nx-dot nx-tint-accent"></span><span class="caption nx-caption">Running</span></span><span style="display:flex;align-items:center;gap:6px"><span class="nx-dot nx-tint-success"></span><span class="caption nx-caption">Done</span></span><span style="display:flex;align-items:center;gap:6px"><span class="nx-dot nx-tint-warning is-pulsing"></span><span class="caption nx-caption">Needs you</span></span></div>
</div>
</body>
</html>
