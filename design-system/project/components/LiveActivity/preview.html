<!-- @dsCard group="Notch" height=132 subtitle="One compact status in the wings beside the closed notch" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiveActivity — preview</title>
<style>
@keyframes pv-pulse { to { opacity: .35; } }
.pv-pulse { animation: nx-appear var(--motion-appear-dur) var(--motion-appear) both, pv-pulse .8s ease-in-out .5s infinite alternate; }
@media (prefers-reduced-motion: reduce) { .pv-pulse { animation: none; } }

.pv-switch { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 6px; padding: 5px; border-radius: 999px; }
.pv-switch .nx-btn { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: var(--text-secondary); }
.pv-switch .nx-btn:hover { color: var(--text-primary); }
.pv-switch .nx-btn[aria-pressed="true"] { background: var(--glass-fill-hover); color: var(--text-primary); box-shadow: inset 0 1px 0 var(--glass-rim), inset 0 0 0 1px var(--glass-rim-soft); }
</style>
</head>
<body>
<div class="nx-stage" style="height:132px">
<div class="nx-screen"><div class="nx-menubar" aria-hidden="true"><span><b>Desktop</b><span>File</span><span>Edit</span><span>View</span></span><span><span>Sat 21 Nov</span><span>19:14</span></span></div><div class="nx-notch" id="notch" data-state="activity"><i class="nx-notch-shadow"></i><div class="nx-notch-surface"></div><div class="nx-wing nx-wing--leading" data-show="activity"><span class="nx-wing-art nx-art--ferry nx-appear"></span></div><div class="nx-wing nx-wing--trailing" data-show="activity"><span class="nx-appear"><span class="nx-eq is-playing" aria-hidden="true"><i></i><i></i><i></i></span></span></div></div><div class="nx-glass pv-switch" role="group" aria-label="Preview state"><button type="button" class="nx-btn" data-activity="nowPlaying" aria-pressed="true">Ambient</button><button type="button" class="nx-btn" data-activity="calendar" aria-pressed="false">Passive</button><button type="button" class="nx-btn" data-activity="convert" aria-pressed="false">Progress</button><button type="button" class="nx-btn" data-activity="claudeAgents" aria-pressed="false">Attention</button></div></div>
</div>
<script>
(function () {
  var ACTIVITIES = {"nowPlaying": ["<span class=\"nx-wing-art nx-art--ferry nx-appear\"></span>", "<span class=\"nx-appear\"><span class=\"nx-eq is-playing\" aria-hidden=\"true\"><i></i><i></i><i></i></span></span>"], "convert": ["<span class=\"nx-appear\"><svg class=\"nx-ring\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" style=\"--p:25\" role=\"img\" aria-label=\"25 percent\"><circle class=\"nx-ring-track\" cx=\"9.0\" cy=\"9.0\" r=\"7.75\"/><circle class=\"nx-ring-value\" cx=\"9.0\" cy=\"9.0\" r=\"7.75\" pathLength=\"100\"/></svg></span>", "<span class=\"numeric nx-numeric nx-appear\">3/12</span>"], "calendar": ["<span class=\"nx-tint-accent nx-appear\"><svg class=\"nx-ic\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.25\" y=\"3\" width=\"11.5\" height=\"10.75\" rx=\"2\"/><path d=\"M2.25 6.5h11.5M5.25 1.75v2.2M10.75 1.75v2.2\"/></g></svg></span>", "<span class=\"numeric nx-numeric nx-appear\" data-countdown=\"725\">12m</span>"], "claudeAgents": ["<span class=\"nx-tint-warning nx-appear pv-pulse\"><svg class=\"nx-ic\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"2.75\" width=\"12\" height=\"10.5\" rx=\"2\"/><path d=\"M4.75 6.25 7 8 4.75 9.75M8.5 10h2.75\"/></g></svg></span>", "<span class=\"numeric nx-numeric nx-tint-warning nx-appear\">Ask</span>"]};
  var wings = document.querySelectorAll('.nx-wing'), buttons = document.querySelectorAll('[data-activity]');

  // CountdownText: Format.countdown — "1h 5m", "12m", "45s", "now"
  function nxCountdown(s) {
    s = Math.ceil(s); if (s <= 0) return 'now'; if (s < 60) return s + 's';
    var m = Math.ceil(s / 60); if (m < 60) return m + 'm';
    var h = Math.floor(m / 60), r = m % 60; return r ? h + 'h ' + r + 'm' : h + 'h';
  }
  function nxWire() { document.querySelectorAll('[data-countdown]').forEach(function (el) { if (el.dataset.wired) return; el.dataset.wired = '1';
    var end = Date.now() + Number(el.dataset.countdown) * 1000;
    function tick() { el.textContent = nxCountdown((end - Date.now()) / 1000); }
    tick(); setInterval(tick, 1000);
  }); }
  nxWire();

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      var a = ACTIVITIES[b.dataset.activity];
      wings[0].innerHTML = a[0]; wings[1].innerHTML = a[1]; nxWire();
      buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
})();
</script>
</body>
</html>
